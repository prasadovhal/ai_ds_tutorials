[project]
name = "llm-evaluation-course"
version = "1.0.0"
description = "Comprehensive LLM Evaluation Course - From Foundations to Production"
requires-python = ">=3.10"
dependencies = [
    # Core data science
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",

    # NLP metrics
    "nltk>=3.8.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",

    # LLM providers
    "ollama>=0.4.0",
    "requests>=2.31.0",

    # LangChain ecosystem
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-huggingface>=0.1.0",
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",

    # Embeddings & vector stores
    "faiss-cpu>=1.7.0",
    "sentence-transformers>=2.2.0",

    # Evaluation frameworks
    "ragas>=0.2.0",
    "deepeval>=2.0.0",

    # Observability & tracing
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "arize-phoenix>=5.0.0",
    "mlflow>=2.9.0",
    "langfuse>=2.0.0",
    "wandb>=0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
