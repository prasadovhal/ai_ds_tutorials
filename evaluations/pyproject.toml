[tool.poetry]
name = "llm-evaluation-course"
version = "1.0.0"
description = "Comprehensive LLM Evaluation Course - From Foundations to Production"
authors = ["Prasad Ovhal <prasadovhal99@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<4.0"

# Core data science
numpy = ">=1.24.0"
pandas = ">=2.0.0"
scikit-learn = ">=1.3.0"
matplotlib = ">=3.7.0"

# NLP metrics
nltk = ">=3.8.0"
rouge-score = ">=0.1.2"

# LLM providers
ollama = ">=0.4.0"
requests = ">=2.31.0"

# LangChain ecosystem
langchain = ">=0.3.0"
langchain-community = ">=0.3.0"
langchain-ollama = ">=0.3.0"
langchain-core = ">=0.3.0"
langchain-huggingface = ">=0.1.0"
langgraph = ">=0.2.0"
langsmith = ">=0.1.0"

# Evaluation frameworks
ragas = ">=0.2.0"
deepeval = ">=2.0.0"

# Observability & tracing
opentelemetry-api = ">=1.20.0"
opentelemetry-sdk = ">=1.20.0"
opentelemetry-exporter-otlp = ">=1.20.0"
mlflow = ">=2.9.0"
langfuse = ">=2.0.0"
wandb = ">=0.15.0"

# Packages requiring PyTorch / C extensions — install separately on Python <=3.13
# poetry install --with ml
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
bert-score = ">=0.3.13"
sentence-transformers = ">=2.2.0"
faiss-cpu = ">=1.7.0"
arize-phoenix = {version = ">=5.0.0", python = ">=3.10,<3.15"}

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
ipykernel = "^7.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
