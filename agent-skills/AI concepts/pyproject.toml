[tool.poetry]
name = "science-gateway"
version = "0.1.0"
description = "Production AI Gateway tutorial for science research assistant"
authors = ["Prasad Ovhal <prasadovhal99@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
ollama = "^0.4.0"
langfuse = "^2.0.0"
sentence-transformers = "^3.0.0"
python-dotenv = "^1.0.0"
opentelemetry-api = "^1.25.0"
opentelemetry-sdk = "^1.25.0"
numpy = "^1.26.0"
faiss-cpu = "^1.8.0"
psycopg2-binary = "^2.9.12"
pgvector = "^0.5.0"
langchain-text-splitters = "^1.1.2"
langchain-community = "^0.4.2"
langchain-huggingface = "^1.2.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
